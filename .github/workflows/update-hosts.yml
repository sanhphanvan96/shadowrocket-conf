name: Update hosts-for-shadowrocket

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC

jobs:
  update-hosts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download hosts file
        run: |
          curl -L -o hosts.txt https://raw.githubusercontent.com/bigdargon/hostsVN/master/option/hosts-iOS

      - name: Run conversion script
        run: |
          python3 hosts-to-rules.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts-for-shadowrocket.txt
          git commit -m "chore: update hosts-for-shadowrocket.txt [auto]" || echo "No changes to commit"
          git push origin develop
