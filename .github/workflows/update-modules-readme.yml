name: Update Modules in README

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'modules/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set fixed branch name
        id: branch-name
        run: |
          echo "branch_name=update-readme-modules" >> $GITHUB_OUTPUT

      - name: Create or reset branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin ${{ steps.branch-name.outputs.branch_name }}; then
            # Branch exists on remote, recreate it
            git checkout -B ${{ steps.branch-name.outputs.branch_name }} --track origin/${{ steps.branch-name.outputs.branch_name }}
            git reset --hard ${{ github.ref_name }}
          else
            # Branch doesn't exist, create it
            git checkout -b ${{ steps.branch-name.outputs.branch_name }}
          fi

      - name: Update README with Modules
        run: |
          python .github/scripts/update_readme_modules.py
          git diff README.md || true

      - name: Check for changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add README.md
          git commit -m "docs: update modules section in README.md [automated]"

          # Force push since we might have reset the branch
          git push --force-with-lease --set-upstream origin ${{ steps.branch-name.outputs.branch_name }}

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch-name.outputs.branch_name }}
          base: ${{ github.ref_name }}
          title: "docs: update modules section in README.md"
          body: |
            This PR was automatically generated by GitHub Actions.

            Updates to the README.md file to reflect changes in the modules directory.

            **Changes made:**
            - Updated module list in README.md based on the contents of the `modules/` directory

            This PR will be automatically updated if more module changes occur.
          labels: documentation, automated pr
          delete-branch: false
