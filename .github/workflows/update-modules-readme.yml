name: Update Modules in README

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'modules/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set fixed branch name
        id: branch-name
        run: |
          echo "branch_name=update-readme-modules" >> $GITHUB_OUTPUT

      - name: Create branch from current branch
        run: |
          echo "Setting up branch: ${{ steps.branch-name.outputs.branch_name }}"
          git fetch origin

          # Create a new branch from the current branch (which is the trigger branch)
          git checkout -b ${{ steps.branch-name.outputs.branch_name }}
          echo "Successfully created branch from ${{ github.ref_name }}"

      - name: Update README with Modules
        run: |
          python .github/scripts/update_readme_modules.py
          echo "===== README.md changes ====="
          git diff README.md || true
          echo "============================"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --exit-code --quiet README.md; then
            echo "No changes detected in README.md"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in README.md"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: update modules section in README.md [automated]"
          echo "Changes committed successfully"

      - name: Push Changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          echo "Pushing changes to branch ${{ steps.branch-name.outputs.branch_name }}"

          # First try to push normally
          if git push origin ${{ steps.branch-name.outputs.branch_name }}; then
            echo "Successfully pushed branch"
          else
            # If that fails, force push (branch might exist but we need to update it)
            echo "Normal push failed, using force push"
            git push --force origin ${{ steps.branch-name.outputs.branch_name }}
          fi

          echo "Push completed"

