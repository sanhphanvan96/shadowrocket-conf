name: Update Modules in README

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'modules/**'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests


      - name: Prepare update branch
        run: |
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}
          git checkout -B update-readme-modules
          echo "Successfully created update-readme-modules branch from ${{ github.ref_name }}"

      - name: Update README with Modules
        run: |
          python .github/scripts/update_readme_modules.py
          echo "===== README.md changes ====="
          git diff README.md || true
          echo "============================"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --exit-code --quiet README.md; then
            echo "No changes detected in README.md"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in README.md"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: update modules section in README.md [automated]"
          echo "Changes committed successfully"

      # Using peter-evans/create-pull-request for simpler PR creation
      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update modules section in README.md [automated]"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: update-readme-modules
          base: ${{ github.ref_name }}
          title: "docs: update modules section in README.md"
          body: |
            This PR was automatically generated by GitHub Actions.

            Updates to the README.md file to reflect changes in the modules directory.

            **Changes made:**
            - Updated module list in README.md based on the contents of the `modules/` directory

            This PR will be automatically updated if more module changes occur.
          labels: documentation, automated pr
          delete-branch: false

      - name: PR Output
        if: steps.create-pr.outputs.pull-request-number
        run: |
          echo "Pull Request Number - ${{ steps.create-pr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.create-pr.outputs.pull-request-url }}"
